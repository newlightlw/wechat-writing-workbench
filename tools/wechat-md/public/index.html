<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>纸间 · 公众号排版台</title><link rel="stylesheet" href="/style.css"><body><header><div><small>MARKDOWN → WECHAT</small><h1>纸间 <span>公众号排版台</span></h1></div><div class="actions"><button id="export">导出 HTML</button><button id="copy" class="primary">复制到公众号</button></div></header><main><section class="controls"><div class="path"><input id="path" placeholder="粘贴 Markdown 文件的完整路径，可读取同目录配图"><button id="load">打开文件</button><label class="button">导入 MD<input type="file" id="file" accept=".md,.markdown,text/plain" hidden></label></div><div class="settings"><label>配色 <select id="theme"><option value="green">松绿</option><option value="blue">湖蓝</option><option value="ink">墨黑</option></select></label><label>字号 <select id="size"><option>15</option><option selected>16</option><option>17</option><option>18</option></select></label><label><input id="hideTitle" type="checkbox" checked>正文隐藏一级标题</label><label><input id="linkNotes" type="checkbox">外链转文末资料</label><button id="title">复制文章标题</button></div></section><div class="workspace"><section class="editor"><div class="panel-heading">MARKDOWN <span id="count"></span></div><textarea id="source" spellcheck="false" aria-label="Markdown 编辑区" placeholder="在这里粘贴 Markdown，或从上方打开文件……"></textarea></section><section class="preview-panel"><div class="panel-heading">正文预览 <span>内联样式 · 适配移动阅读</span></div><div class="paper"><article id="preview"></article></div></section></div><section class="bottom"><p id="status" role="status">准备就绪</p><p class="hint">使用方式：打开 MD → 调整排版 → 复制到公众号 → 在公众号正文编辑区粘贴。标题可单独复制。所有转换在本机完成。</p><p class="hint">本地图片会嵌入富文本与 HTML；微信可能过滤剪贴板图片，发布前请确认，必要时从下方逐张保存并上传。预览不能保证微信粘贴后完全一致。</p><details><summary id="image-count">图片素材</summary><div id="images"></div></details><div id="warnings"></div></section></main><script type="module" src="/app.js"></script></body></html>
